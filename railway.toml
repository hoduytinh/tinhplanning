# Railway deploy config — chỉ build/deploy thư mục backend.
# Trong Railway dashboard đặt "Root Directory" = backend, hoặc dùng file này.

[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Chạy migration rồi start server. entrypoint.sh đã lo phần này.
startCommand = "./entrypoint.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Ghi chú:
# - Tạo Volume trong Railway, mount vào /data để giữ file SQLite.
# - Set biến môi trường DATABASE_URL, CORS_ORIGINS (thêm domain Vercel).
