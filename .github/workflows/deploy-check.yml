name: Deploy Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & syntax check
        run: |
          cd backend
          pip install -r requirements.txt
          python -m py_compile main.py
          echo "✓ Backend OK"

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        run: |
          cd frontend
          npm install
          VITE_API_URL=https://placeholder.railway.app npm run build
          echo "✓ Frontend OK"
